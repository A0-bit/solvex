upstream django_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # Redirect HTTP → HTTPS in production (uncomment when SSL is configured)
    # return 301 https://$host$request_uri;

    client_max_body_size 15M;

    # API proxy
    location /api/ {
        proxy_pass http://django_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin
    location /admin/ {
        proxy_pass http://django_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files (served by Nginx directly)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media files (development only; production uses S3)
    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    # Frontend (served by Vercel/separate container in production)
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

